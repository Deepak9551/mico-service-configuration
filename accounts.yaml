spring:
  application:
    name: accounts
  datasource:
    # jdbc:nameOfDataBase:address/db
    url: jdbc:h2:file:./accounts/data/account
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 10
  h2:
    console:
      enabled: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true
    hibernate:
      ddl-auto: update # auto create table ( schema )
  sql:
    init:
      mode: always

# tomcat server
server:
  port: 8081

build:
  version: "0.1"

accounts:
